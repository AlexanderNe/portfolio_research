<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Total equity</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, Arial, sans-serif;
    background: #131820; color: #dbe2ec; font-size: 14px;
  }
  header {
    background: #1c2431; border-bottom: 1px solid #2c3648;
    padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .btn {
    background: #2b3748; cursor: pointer; border: 1px solid #3d4a5f; border-radius: 6px;
    color: #dbe2ec; padding: 5px 12px; font-size: 12px;
  }
  .btn:hover { background: #34445c; }
  #legend { font-size: 12px; color: #8fa3bf; margin-left: auto; }
  main { padding: 16px 20px; }
  .chartwrap { position: relative; background: #161d29; border: 1px solid #2c3648; border-radius: 8px; touch-action: none; }
  canvas { display: block; width: 100%; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .tooltip {
    position: absolute; pointer-events: none; background: #232f42; border: 1px solid #3d4a5f;
    border-radius: 6px; padding: 6px 10px; font-size: 12px; line-height: 1.5;
    display: none; white-space: nowrap; z-index: 5; color: #dbe2ec;
  }
  .tooltip b { color: #7fb3e8; }
  .tooltip .up { color: #7fd18a; }
  .tooltip .down { color: #e88f8f; }
  .errorbox { display: none; background: #4a1d1d; border: 1px solid #7a3030; color: #ffd2d2; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; }
  @media (max-width: 720px) {
    header { padding: 8px 12px; gap: 10px; }
    main { padding: 10px 12px; }
    .btn { padding: 8px 14px; font-size: 13px; }
    #legend { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Total equity</h1>
  <button class="btn" id="btnReset" title="Reset zoom">Reset view</button>
  <div id="legend"></div>
</header>
<main>
  <div class="chartwrap">
    <canvas id="cv"></canvas>
    <div class="tooltip" id="tip"></div>
  </div>
  <div class="errorbox" id="errorBox"></div>
</main>
<script>
"use strict";
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const tip = document.getElementById("tip");
let data = null;
let scale = null;
let W = 0, H = 560;
const PAD = { l: 64, r: 16, t: 16, b: 24 };
let view = { from: 0, to: 1 };
let panning = null;

function fmtMoney(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return (v > 0 ? "+" : "") + Number(v).toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
}
function fmtDay(ms) {
  const d = new Date(ms);
  return isNaN(d) ? "—" : d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "2-digit" });
}

async function load() {
  try {
    const res = await fetch("/api/equity-data", { credentials: "same-origin" });
    if (res.status === 401) { fail("Authentication required."); return; }
    if (!res.ok) { fail("HTTP " + res.status + ": " + (await res.text())); return; }
    data = await res.json();
    document.getElementById("title").textContent = "Total equity";
    render();
  } catch (err) {
    fail("Failed to load equity data: " + err.message);
  }
}

function fail(msg) {
  document.getElementById("title").textContent = "Total equity — unavailable";
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
}

function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(300, Math.floor(rect.width));
  H = Math.max(340, Math.min(560, Math.floor((window.innerHeight || 900) * 0.65)));
  cv.style.width = W + "px";
  cv.style.height = H + "px";
  cv.width = Math.floor(W * dpr);
  cv.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function computeScale() {
  const pts = data.points || [];
  const n = pts.length;
  if (n === 0) { scale = null; return; }
  let tMin = Infinity, tMax = -Infinity, eMin = Infinity, eMax = -Infinity;
  pts.forEach(p => {
    const t = new Date(p.time).getTime();
    if (isNaN(t)) return;
    if (t < tMin) tMin = t;
    if (t > tMax) tMax = t;
    const e = Number(p.equity);
    if (e < eMin) eMin = e;
    if (e > eMax) eMax = e;
  });
  if (tMax === tMin) { tMin -= 86400000; tMax += 86400000; }
  const tPad = (tMax - tMin) * 0.03;
  tMin -= tPad; tMax += tPad;
  eMin = isFinite(eMin) ? eMin : Number(data.initialPool);
  eMax = isFinite(eMax) ? eMax : Number(data.equity);
  const ePad = (eMax - eMin) * 0.06 || 1;
  const yMin = eMin - ePad, yMax = eMax + ePad;
  const plotW = W - PAD.l - PAD.r, plotH = H - PAD.t - PAD.b;
  const windowFrac = Math.max(1e-6, view.to - view.from);
  const eSpan = yMax - yMin;
  scale = {
    n, plotW, plotH, windowFrac, tMin, tMax, yMin, yMax, eSpan,
    xFor: t => PAD.l + ((t - tMin) / (tMax - tMin) - view.from) / windowFrac * plotW,
    yFor: e => PAD.t + plotH - (e - yMin) / eSpan * plotH,
  };
}

function drawGrid() {
  ctx.strokeStyle = "#232c3b"; ctx.lineWidth = 1;
  ctx.fillStyle = "#8fa3bf"; ctx.font = "11px Consolas, monospace";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let i = 0; i <= 6; i++) {
    const e = scale.yMin + (scale.yMax - scale.yMin) * i / 6;
    const y = scale.yFor(e);
    ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
    ctx.fillText(fmtMoney(e), PAD.l - 6, y);
  }
  const labelCount = 6;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  let prevX = -100;
  for (let i = 0; i < labelCount; i++) {
    const f = view.from + (i / (labelCount - 1)) * (view.to - view.from);
    if (f < 0 || f > 1) continue;
    const t = scale.tMin + f * (scale.tMax - scale.tMin);
    const x = scale.xFor(t);
    if (x - prevX < 70) continue;
    prevX = x;
    ctx.fillText(fmtDay(t), x, H - PAD.b + 6);
  }
}

function drawBaseline() {
  const y = scale.yFor(Number(data.initialPool));
  ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(PAD.l, y); ctx.lineTo(W - PAD.r, y); ctx.stroke();
  ctx.setLineDash([]);
}

function drawCurve() {
  const pts = (data.points || []).filter(p => {
    const t = new Date(p.time).getTime();
    return !isNaN(t) && isFinite(Number(p.equity));
  });
  if (pts.length === 0) return;
  const path = [];
  pts.forEach(p => {
    const x = scale.xFor(new Date(p.time).getTime());
    const y = scale.yFor(Number(p.equity));
    path.push([x, y]);
  });
  const current = Number(data.equity);
  const up = current >= Number(data.initialPool);
  const color = up ? "#4da3ff" : "#e88f8f";
  ctx.beginPath();
  ctx.moveTo(path[0][0], path[0][1]);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(path[0][0], scale.yFor(scale.yMin));
  for (let i = 0; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
  ctx.lineTo(path[path.length - 1][0], scale.yFor(scale.yMin));
  ctx.closePath();
  ctx.fillStyle = up ? "rgba(77,163,255,.14)" : "rgba(232,143,143,.14)";
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(path[path.length - 1][0], path[path.length - 1][1], 3.5, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
}

function buildLegend() {
  const pix = "·";
  const parts = [
    "points: " + (data.points || []).length,
    "realized: " + fmtMoney(data.realized),
    "open: " + fmtMoney(data.unrealized),
    "equity: " + fmtMoney(data.equity)
  ];
  document.getElementById("legend").textContent = parts.join("   " + pix + "   ");
}

function render() {
  resize();
  ctx.clearRect(0, 0, W, H);
  computeScale();
  if (!scale) { buildLegend(); return; }
  drawGrid();
  ctx.save();
  ctx.beginPath();
  ctx.rect(PAD.l, PAD.t, scale.plotW, scale.plotH);
  ctx.clip();
  drawBaseline();
  drawCurve();
  ctx.restore();
  buildLegend();
}

function showTipAt(mx, my) {
  if (!scale) { tip.style.display = "none"; return; }
  let best = null, bestDist = Infinity;
  (data.points || []).forEach(p => {
    const t = new Date(p.time).getTime();
    if (isNaN(t) || !isFinite(Number(p.equity))) return;
    const d = Math.abs(scale.xFor(t) - mx);
    if (d < bestDist) { bestDist = d; best = p; }
  });
  if (!best || bestDist > 36) { tip.style.display = "none"; return; }
  const t = new Date(best.time).getTime();
  const e = Number(best.equity);
  const base = Number(data.initialPool);
  const delta = e - base;
  const cls = delta >= 0 ? "up" : "down";
  const pct = base !== 0 ? delta / base * 100 : 0;
  tip.innerHTML = "<b>" + fmtDay(t) + "</b><br>equity: " + fmtMoney(e) +
    "<br><span class=\"" + cls + "\">" + (delta >= 0 ? "+" : "") + fmtMoney(delta) + " RUB (" + fmtPct(pct) + ")</span>";
  tip.style.display = "block";
  tip.style.left = (mx + 14) + "px";
  tip.style.top = (my + 14) + "px";
}

function applyHorizontal(mx, factor) {
  if (!scale) return;
  const fx = Math.min(1, Math.max(0, (mx - PAD.l) / scale.plotW));
  const curWidth = Math.max(1e-6, view.to - view.from);
  const minWidth = Math.min(1, (6 * 3600 * 1000) / Math.max(1, scale.tMax - scale.tMin));
  const newWidth = Math.min(1, Math.max(minWidth, curWidth * factor));
  const anchor = view.from + fx * curWidth;
  view.from = anchor - fx * newWidth;
  view.to = view.from + newWidth;
}

function panBy(dx) {
  if (!scale || dx === 0) return;
  const windowFrac = Math.max(1e-6, view.to - view.from);
  const shift = (dx / scale.plotW) * windowFrac;
  view.from -= shift;
  view.to -= shift;
}

cv.addEventListener("mousemove", e => {
  if (panning) { tip.style.display = "none"; return; }
  const rect = cv.getBoundingClientRect();
  showTipAt(e.clientX - rect.left, e.clientY - rect.top);
});

cv.addEventListener("mouseleave", () => { tip.style.display = "none"; });

cv.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
  tip.style.display = "none";
  applyHorizontal(mx, factor);
  render();
}, { passive: false });

document.getElementById("btnReset").onclick = () => {
  view = { from: 0, to: 1 };
  if (data) render();
};

cv.addEventListener("mousedown", e => {
  if (e.button !== 1) return;
  e.preventDefault();
  panning = { lastX: e.clientX, lastY: e.clientY };
  cv.style.cursor = "grabbing";
  tip.style.display = "none";
});

window.addEventListener("mousemove", e => {
  if (!panning || !scale) return;
  e.preventDefault();
  panBy(e.clientX - panning.lastX);
  panning.lastX = e.clientX;
  render();
});

window.addEventListener("mouseup", e => {
  if (e.button === 1 && panning) {
    panning = null;
    cv.style.cursor = "";
  }
});
window.addEventListener("blur", () => {
  if (panning) {
    panning = null;
    cv.style.cursor = "";
  }
});

let gesture = null;
let tap = null;

function touchDist(a, b) {
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

cv.addEventListener("touchstart", e => {
  if (e.touches.length >= 2) {
    e.preventDefault();
    gesture = {
      dist: touchDist(e.touches[0], e.touches[1]),
      midX: (e.touches[0].clientX + e.touches[1].clientX) / 2,
      midY: (e.touches[0].clientY + e.touches[1].clientY) / 2
    };
    tap = null;
    tip.style.display = "none";
  } else if (e.touches.length === 1 && !gesture) {
    tap = { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: false };
  }
}, { passive: false });

cv.addEventListener("touchmove", e => {
  if (!scale) return;
  if (e.touches.length >= 2 && gesture) {
    e.preventDefault();
    tip.style.display = "none";
    tap = null;
    const t = e.touches;
    const dist = touchDist(t[0], t[1]);
    const midX = (t[0].clientX + t[1].clientX) / 2;
    const midY = (t[0].clientY + t[1].clientY) / 2;
    const rect = cv.getBoundingClientRect();
    const factor = gesture.dist > 0 ? gesture.dist / dist : 1;
    applyHorizontal(midX - rect.left, factor);
    panBy(midX - gesture.midX);
    render();
    gesture.dist = dist;
    gesture.midX = midX;
    gesture.midY = midY;
  } else if (e.touches.length === 1 && tap && !gesture) {
    const t = e.touches[0];
    if (Math.hypot(t.clientX - tap.x, t.clientY - tap.y) > 8) tap.moved = true;
  }
}, { passive: false });

cv.addEventListener("touchend", e => {
  const remaining = e.touches.length;
  if (remaining < 2) gesture = null;
  if (remaining === 0) {
    if (tap && !tap.moved && scale) {
      const rect = cv.getBoundingClientRect();
      showTipAt(tap.x - rect.left, tap.y - rect.top);
    }
    tap = null;
  }
});
cv.addEventListener("touchcancel", () => { gesture = null; tap = null; });

window.addEventListener("resize", () => { if (data) render(); });

load();
</script>
</body>
</html>
