<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Trading System - Admin Panel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, Arial, sans-serif;
    background: #131820; color: #dbe2ec; font-size: 14px;
  }
  header {
    background: #1c2431; border-bottom: 1px solid #2c3648;
    padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    position: relative;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  .statusline { display: flex; gap: 12px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .statusline .pill { padding: 3px 10px; border-radius: 12px; font-size: 12px; border: 1px solid #333; }
  .btn {
    background: #2b3748; cursor: pointer; border: 1px solid #3d4a5f; border-radius: 6px;
    color: #dbe2ec; padding: 6px 12px; font-size: 13px;
  }
  .btn:hover { background: #34445c; }
  .btn.primary { background: #1e6fd9; border-color: #1e6fd9; }
  .btn.danger { background: #a83232; border-color: #a83232; }
  .btn.ok { background: #2e7d32; border-color: #2e7d32; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  main { padding: 20px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; font-size: 15px; }
  .card { background: #1a2230; border: 1px solid #2c3648; border-radius: 8px; padding: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #232c3b; vertical-align: top; }
  th { color: #8fa3bf; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  tr:hover td { background: #1e2736; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
  .badge.green { background: #1d3b26; color: #7fd18a; }
  .badge.gray  { background: #2d3440; color: #9aa7b8; }
  .badge.blue  { background: #1d324f; color: #7fb3e8; }
  .badge.orange{ background: #4a3418; color: #e8b36f; }
  .badge.red   { background: #4a1d1d; color: #e88f8f; }
  .badge.purple{ background: #33215a; color: #c0a6f0; }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: #7a8699; font-style: italic; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions .btn { padding: 3px 9px; font-size: 12px; }
  .detail { display: none; background: #141b27; margin-top: 4px; padding: 10px; border: 1px solid #2c3648; border-radius: 6px; }
  .detail.open { display: block; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    background: transparent; border: 1px solid #3d4a5f; color: #9fb0c8; cursor: pointer;
    padding: 8px 18px; font-size: 13px; border-radius: 8px 8px 0 0;
  }
  .tab:hover { background: #1c2431; color: #dbe2ec; }
  .tab.active { background: #1a2230; color: #fff; border-bottom-color: #1a2230; }
  .filterbox input[type="text"] {
    background: #131820; border: 1px solid #3d4a5f; color: #dbe2ec; border-radius: 5px;
    padding: 6px 8px; font-size: 13px; width: 190px;
  }
  .pager { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  .pager .btn:disabled { opacity: .5; cursor: not-allowed; }
  .pager .pageinfo { color: #8fa3bf; font-size: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 18px; }
  .kv { font-size: 12px; }
  .kv b { color: #8fa3bf; font-weight: 600; }
  .kv span { float: right; }
  details.addform summary { cursor: pointer; color: #7fb3e8; margin-bottom: 8px; font-weight: 600; }
  form.instrument-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px 12px; align-items: end; }
  form.instrument-form label { font-size: 11px; color: #8fa3bf; display: flex; flex-direction: column; gap: 3px; }
  form.instrument-form input, form.instrument-form select {
    background: #131820; border: 1px solid #3d4a5f; color: #dbe2ec; border-radius: 5px; padding: 5px 7px; font-size: 13px;
  }
  .signals { margin-top: 10px; }
  .signals table th { font-size: 11px; }
  .errorbox { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; max-width: 55%; background: #4a1d1d; border: 1px solid #7a3030; color: #ffd2d2; border-radius: 6px; padding: 6px 12px; white-space: pre-line; text-align: center; font-size: 12px; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: #232f42; border: 1px solid #3d4a5f;
           padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 50; }
  @media (max-width: 900px) {
    .statusline { margin-left: 0; }
    .errorbox { position: static; transform: none; max-width: 100%; font-size: 13px; text-align: left; }
  }
</style>
</head>
<body>
<header>
  <h1>Portfolio Trading System</h1>
  <div class="statusline">
    <span class="pill" id="globalState">state: -</span>
    <span class="pill" id="engineCount">engines: -</span>
    <span class="pill" id="counts">instruments: -</span>
    <button class="btn danger" onclick="control('stop', this)">Stop all</button>
    <button class="btn ok" onclick="control('reset', this)" title="reinitialize modules, clear caches, reload instruments">Reset state</button>
    <button class="btn primary" onclick="control('resume', this)">Resume all</button>
    <button class="btn" onclick="resolveAll(this)">Resolve all</button>
  </div>
  <div class="errorbox" id="errorBox"></div>
</header>
<main>
  <nav class="tabs">
    <button class="tab active" data-view="instruments" onclick="showView('instruments')">Instruments</button>
    <button class="tab" data-view="signals" onclick="showView('signals')">Signals</button>
  </nav>

  <section id="view-instruments">
    <div class="card">
      <details class="addform">
        <summary>+ Add instrument</summary>
        <form class="instrument-form" id="addForm">
          <label>Ticker * <input name="ticker" required style="text-transform:uppercase"></label>
          <label>Name <input name="name"></label>
          <label>Lot size <input name="lotSize" type="number" value="1" min="1"></label>
          <label>Future ticker <input name="futureTicker"></label>
          <label>Future FIGI <input name="futureFigi"></label>
          <label>Future class code <input name="futureClassCode"></label>
          <label>Processing status
            <select name="processingStatus"><option>paused</option><option>running</option></select>
          </label>
          <button class="btn primary" type="submit">Create</button>
        </form>
      </details>
    </div>

    <div class="card" style="margin-top:14px; overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Ticker</th><th>Name</th><th>Status</th><th>FIGI / ISIN / Lot / Future</th>
            <th>Engine</th><th>Last candle</th><th>ROC / ATR</th><th>Position</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="9" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section id="view-signals" hidden>
    <div class="card">
      <div class="toolbar">
        <h2>Signal log</h2>
        <div class="filterbox">
          <input type="text" id="sigTicker" list="tickerOptions" placeholder="Filter by ticker…">
          <datalist id="tickerOptions"></datalist>
        </div>
        <button class="btn primary" onclick="applyTickerFilter()">Apply</button>
        <button class="btn" onclick="clearTickerFilter()">Reset</button>
        <span class="empty" id="sigTotal"></span>
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr>
              <th>Time</th><th>Ticker</th><th>Type</th><th>Direction</th><th>Price</th>
              <th>SL</th><th>TP</th><th>Exit</th><th>Exit reason</th><th>PnL</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="sigRows">
            <tr><td colspan="11" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pager">
        <button class="btn" id="sigPrev" onclick="sigPage(-1)">Prev</button>
        <span class="pageinfo" id="sigPageInfo"></span>
        <button class="btn" id="sigNext" onclick="sigPage(1)">Next</button>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";
let instruments = [];
let metricByTicker = {};
let expandedTicker = null;
let editState = null;
let currentView = "instruments";
let sigState = { ticker: "", page: 1, pageSize: 50, total: 0, totalPages: 1, hasRows: false };
const signalsHtml = {};

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials: "same-origin" }, opts || {}));
  if (res.status === 401) {
    showError("Authentication required. Please reload the page and log in with the admin credentials.");
    throw new Error("401");
  }
  if (!res.ok) {
    let text = "";
    try { text = await res.text(); } catch (e) { /* ignore */ }
    const err = new Error(text || ("HTTP " + res.status));
    err.status = res.status;
    try { Object.assign(err, JSON.parse(text)); } catch (e) { /* body is not JSON */ }
    throw err;
  }
  if (res.status === 204) return null;
  const ct = res.headers.get("content-type") || "";
  return ct.indexOf("json") >= 0 ? res.json() : res.text();
}

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
function fmtNum(v, digits) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: digits === undefined ? 2 : digits });
}
function fmtPct(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return (v > 0 ? "+" : "") + Number(v).toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";
}
function badge(text, cls) { return '<span class="badge ' + (cls || "gray") + '">' + esc(text) + "</span>"; }
function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function stateBadges(instr) {
  const procCls = instr.processingStatus === "Running" ? "green" : "orange";
  return badge(instr.processingStatus, procCls);
}
function engineBadge(m) {
  if (!m) return badge("no engine", "gray");
  if (m.status === "error") return badge("error", "red");
  if (m.status === "warming up") return badge("warming up", "orange");
  if (m.status === "running") return badge("running", "green");
  return badge(m.status || "stopped", "gray");
}
function showError(msg) {
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
  setTimeout(() => { box.style.display = "none"; }, 8000);
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.opacity = 1;
  setTimeout(() => { t.style.opacity = 0; }, 3000);
}

async function refresh() {
  try {
    const text = await api("/");
    const stateMatch = text.match(/global state:\s*(\w+)/);
    const engMatch = text.match(/engines running:\s*(\d+)/);
    const cntMatch = text.match(/instruments:\s*(\d+) \(running: (\d+)\)/);
    document.getElementById("globalState").textContent = "state: " + (stateMatch ? stateMatch[1] : "?");
    document.getElementById("engineCount").textContent = "engines: " + (engMatch ? engMatch[1] : "?");
    document.getElementById("counts").textContent = "instruments: " + (cntMatch ? cntMatch[1] : "?") + " (running: " + (cntMatch ? cntMatch[2] : "?") + ")";

    const views = await api("/api/instruments");
    instruments = views.map(v => Object.assign({}, v.instrument, { metrics: v.metrics || null }));
    metricByTicker = {};
    instruments.forEach(i => { if (i.metrics) metricByTicker[i.ticker] = i.metrics; });
    if (!editState) renderRows();
  } catch (e) {
    if (e.message !== "401") showError("Refresh failed: " + e.message);
  }
}

function renderRows() {
  const tbody = document.getElementById("rows");
  if (!instruments.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">No instruments.</td></tr>';
    return;
  }
  tbody.innerHTML = instruments.map(instr => {
    const m = instr.metrics;
    const mBadge = engineBadge(m);
    const lastCandle = m ? fmtTime(m.lastCandleTime) + " @ " + fmtNum(m.lastCandleClose, 4) : "—";
    const rocAtr = m ? fmtNum(m.roc, 4) + " / " + fmtNum(m.atr, 4) : "—";
    const posState = m ? (m.positionState === "long" ? badge("LONG", "green")
                       : m.positionState === "short" ? badge("SHORT", "red")
                       : badge("flat", "gray")) : badge("—", "gray");
    const posSince = m && m.positionSince ? " since " + fmtTime(m.positionSince) : "";
    const activePos = m && (m.positionState === "long" || m.positionState === "short");
    const hasErr = m && m.lastError ? ' title="' + esc(m.lastError) + '"' : "";
    const future = instr.futureTicker ? instr.futureTicker + (instr.futureFigi ? " (" + instr.futureFigi + ")" : "") : "";
    const isOpen = expandedTicker === instr.ticker;
    return '<tr>' +
      '<td><b>' + esc(instr.ticker) + '</b></td>' +
      '<td>' + esc(instr.name || "") + '</td>' +
      '<td>' + stateBadges(instr) + '</td>' +
      '<td class="mono">' + esc(instr.figi || "") + ' / ' + esc(instr.isin || "") + ' / ' + instr.lotSize +
        (future ? ' / ' + esc(future) : '') + '</td>' +
      '<td' + hasErr + '>' + mBadge + (m && m.warmupDone ? ' · warm' : '') + '</td>' +
      '<td class="mono">' + lastCandle + '</td>' +
      '<td class="mono">' + rocAtr + '</td>' +
      '<td>' + posState + posSince + (m && m.pendingSignal !== 0 && m.pendingSignal ? " · signal " + (m.pendingSignal > 0 ? "L" : "S") : "") +
        (activePos ? ' <button class="btn" title="Repost the active signal to Telegram as a duplicate" onclick="resendActive(\'' + instr.id + '\')">Resend signal to Telegram</button>' : "") + '</td>' +
      '<td class="row-actions">' +
        '<button class="btn" onclick="actions.expand(\'' + instr.id + '\')">Detail</button>' +
        '<button class="btn" onclick="window.open(\'/chart?id=' + instr.id + '\', \'_blank\')">Chart</button>' +
        '<button class="btn" onclick="actions.pause(\'' + instr.id + '\', this)">' + (instr.processingStatus === "Running" ? "Pause" : "Resume") + '</button>' +
        '<button class="btn" onclick="actions.resolve(\'' + instr.id + '\')">Resolve</button>' +
        '<button class="btn" onclick="actions.edit(\'' + instr.id + '\')">' + (editState && editState.ticker === instr.ticker ? "Cancel edit" : "Edit") + '</button>' +
        '<button class="btn danger" onclick="actions.del(\'' + instr.id + '\', \'' + esc(instr.ticker) + '\')">Delete</button>' +
      '</td></tr>' +
      (isOpen ? '<tr id="detail-' + instr.ticker + '"><td colspan="9"><div class="detail open" id="detailBox-' + instr.ticker + '">' +
        (editState && editState.ticker === instr.ticker ? editFormHtml(instr) : "") +
        '<div class="grid2">' +
        kv("Engine status", m ? m.status : "no engine") +
        kv("Last run time", fmtTime(m && m.lastRunTime)) +
        kv("Last error", m && m.lastError || "") +
        kv("Warm-up", m ? (m.warmupDone ? "done (" + m.warmupBars + " bars)" : "in progress / not done") : "—") +
        kv("Last processed bar", fmtTime(m && m.lastProcessedBarTime)) +
        kv("Bars processed", m ? m.barsProcessed : "—") +
        kv("Latest close", fmtNum(m && m.latestClose, 4)) +
        kv("ROC (" + "n=5)", fmtNum(m && m.roc, 4)) +
        kv("ATR (" + "14)", fmtNum(m && m.atr, 4)) +
        kv("Cash", fmtNum(m && m.cash)) +
        kv("Equity", fmtNum(m && m.equity)) +
        kv("Position", m ? m.positionState : "—") +
        kv("Pending signal", m && m.pendingSignal ? (m.pendingSignal > 0 ? "LONG" : "SHORT") : "none") +
        kv("UID", instr.uid || "—") +
        kv("FIGI", instr.figi || "—") +
        '</div>' +
        '<div class="signals" id="sig-' + instr.ticker + '">' + (signalsHtml[instr.ticker] || '<span class="empty">Loading signals…</span>') + '</div>' +
        '</div></td></tr>' : '');
  }).join("");
}

function draft(field, value) {
  if (editState) editState.values[field] = value;
}

function editFormHtml(instr) {
  const v = editState && editState.ticker === instr.ticker ? editState.values : {};
  const valueOf = f => esc(v[f] !== undefined && v[f] !== null ? v[f] : (instr[f] === null || instr[f] === undefined ? "" : instr[f]));
  const input = (label, f, opts) =>
    `<label>${label} <input data-f="${f}"${opts || ""} value="${valueOf(f)}" oninput="draft('${f}', this.value)"></label>`;
  const processing = v.processingStatus !== undefined ? v.processingStatus : instr.processingStatus;
  return `<form class="instrument-form" style="margin-top:10px">
    <label>Ticker <input value="${esc(instr.ticker)}" disabled></label>
    ${input("Name", "name")}
    ${input("ISIN", "isin")}
    ${input("FIGI", "figi")}
    ${input("UID", "uid")}
    ${input("Class code", "classCode")}
    ${input("Lot size", "lotSize", ' type="number" min="1"')}
    ${input("Future ticker", "futureTicker")}
    ${input("Future FIGI", "futureFigi")}
    ${input("Future class code", "futureClassCode")}
    <label>Processing status <select data-f="processingStatus" oninput="draft('processingStatus', this.value)">
      ${statusOptions("paused", processing)}${statusOptions("running", processing)}</select></label>
    <div class="row-actions">
      <button class="btn ok" type="button" onclick="actions.saveEdit('${instr.id}')">Save</button>
      <button class="btn" type="button" onclick="actions.cancelEdit()">Cancel</button>
    </div>
  </form>`;
}

function kv(k, v) {
  return '<div class="kv"><b>' + esc(k) + '</b><span>' + esc(v) + "</span></div>";
}

const actions = {
  expand(id) {
    const instr = instruments.find(i => i.id === id);
    if (!instr) return;
    const wasOpen = expandedTicker === instr.ticker;
    expandedTicker = wasOpen ? null : instr.ticker;
    renderRows();
    if (!wasOpen) loadSignals(id, instr.ticker);
  },
  async resolve(id) {
    const instr = instruments.find(i => i.id === id);
    if (!instr) return;
    try {
      await api("/api/instruments/" + id + "/resolve", { method: "POST" });
      toast("Resolved " + instr.ticker + " (UID/FIGI set)");
      await refresh();
    } catch (err) {
      if (err.status === 409) {
        const list = (err.candidates || []).map(c =>
          c.ticker + " (" + c.classCode + ") " + (c.name || "") + " — figi " + c.figi + (c.apiTradeAvailable ? "" : " (not tradeable)"));
        showError("Ambiguous ticker " + instr.ticker + ". Candidates:\n" + list.join("\n"));
      } else {
        showError("Resolve failed: " + (err.message || err.status));
      }
    }
  },
  async pause(id, btn) {
    const instr = instruments.find(i => i.id === id);
    const action = instr && instr.processingStatus === "Running" ? "pause" : "resume";
    await dangerousButton(btn, async () => {
      await api("/api/instruments/" + id + "/" + action, { method: "POST" });
      toast((action === "pause" ? "Paused " : "Resumed ") + instr.ticker);
      await refresh();
    });
  },
  edit(id) {
    const instr = instruments.find(i => i.id === id);
    if (!instr) return;
    if (editState && editState.ticker === instr.ticker) { actions.cancelEdit(); return; }
    const s = lower(instr);
    editState = {
      id: id,
      ticker: instr.ticker,
      values: {
        name: instr.name || "", isin: instr.isin || "", figi: instr.figi || "", uid: instr.uid || "",
        classCode: instr.classCode || "",
        lotSize: String(instr.lotSize), futureTicker: instr.futureTicker || "", futureFigi: instr.futureFigi || "",
        futureClassCode: instr.futureClassCode || "", processingStatus: s.processingStatus,
      },
    };
    expandedTicker = instr.ticker;
    renderRows();
    loadSignals(id, instr.ticker);
  },
  async saveEdit(id) {
    if (!editState) return;
    const v = editState.values;
    const payload = {
      ticker: editState.ticker,
      name: v.name || "", isin: v.isin || "", figi: v.figi || "", uid: v.uid || "", classCode: v.classCode || "",
      lotSize: parseInt(v.lotSize, 10) || 1,
      futureTicker: v.futureTicker || "", futureFigi: v.futureFigi || "", futureClassCode: v.futureClassCode || "",
      processingStatus: v.processingStatus,
    };
    try {
      await api("/api/instruments/" + editState.id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      toast("Saved " + editState.ticker);
      editState = null;
      await refresh();
    } catch (err) { showError("Update failed: " + err.message); }
  },
  cancelEdit() {
    if (!editState) return;
    editState = null;
    renderRows();
  },
  async del(id, ticker) {
    if (!confirm("Delete instrument " + ticker + " from the system?")) return;
    try {
      await api("/api/instruments/" + id, { method: "DELETE" });
      toast("Deleted " + ticker); await refresh();
    } catch (err) { showError("Delete failed: " + err.message); }
  },
};

async function dangerousButton(btn, fn) {
  btn.disabled = true;
  try { await fn(); } catch (err) { showError(err.message); }
  finally { btn.disabled = false; }
}

async function control(action, btn) {
  await dangerousButton(btn, async () => {
    await api("/api/control/" + action, { method: "POST" });
    toast("Command '" + action + "' sent");
    await refresh();
  });
}

async function resolveAll(btn) {
  await dangerousButton(btn, async () => {
    try {
      const res = await api("/api/instruments/resolve-all", { method: "POST" });
      const fails = res.failed || [];
      if (fails.length) {
        showError("Resolve all: " + res.resolved + "/" + res.pending + " resolved.\n" +
          fails.map(f => f.ticker + ": " + f.error + (f.message ? " — " + f.message : "")).join("\n"));
      } else {
        toast("Resolve all: " + res.resolved + "/" + res.pending + " resolved");
      }
      await refresh();
    } catch (err) { showError("Resolve all failed: " + err.message); }
  });
}

function statusOptions(text, current) {
  return '<option value="' + text + '"' + (String(current).toLowerCase() === text ? " selected" : "") + ">" + text + "</option>";
}
function lower(instr) {
  return {
    processingStatus: String(instr.processingStatus || "Paused").toLowerCase(),
  };
}

async function loadSignals(id, ticker) {
  if (signalsHtml[ticker]) return;
  const box = document.getElementById("sig-" + ticker);
  if (box) box.innerHTML = '<span class="empty">Loading…</span>';
  try {
    const list = await api("/api/instruments/" + id + "/signals?limit=50");
    signalsHtml[ticker] = !list.length
      ? '<span class="empty">No signals yet.</span>'
      : '<table><thead><tr><th>Time</th><th>Type</th><th>Dir</th><th>Price</th>' +
        '<th>SL</th><th>TP</th><th>Exit</th><th>Exit reason</th><th>PnL</th></tr></thead><tbody>' +
        list.map(s => '<tr>' +
          '<td class="mono">' + fmtTime(s.timestamp) + '</td>' +
          '<td>' + esc(s.type) + '</td>' +
          '<td>' + (s.direction === "Long" ? badge("LONG", "green") : s.direction === "Short" ? badge("SHORT", "red") : "—") + '</td>' +
          '<td class="mono num">' + fmtNum(s.price, 4) + '</td>' +
          '<td class="mono num">' + fmtNum(s.stopLoss, 4) + '</td>' +
          '<td class="mono num">' + fmtNum(s.takeProfit, 4) + '</td>' +
          '<td class="mono num">' + fmtNum(s.exitPrice, 4) + '</td>' +
          '<td>' + (s.exitReason ? esc(s.exitReason) : "—") + '</td>' +
          '<td class="mono num">' + fmtPct(s.pnlPercent) + '</td>' +
        '</tr>').join("") + '</tbody></table>';
    const b2 = document.getElementById("sig-" + ticker);
    if (b2) b2.innerHTML = signalsHtml[ticker];
  } catch (err) {
    signalsHtml[ticker] = '<span class="empty">Signals failed: ' + esc(err.message) + "</span>";
    const b3 = document.getElementById("sig-" + ticker);
    if (b3) b3.innerHTML = signalsHtml[ticker];
  }
}

function showView(name) {
  currentView = name;
  document.getElementById("view-instruments").hidden = name !== "instruments";
  document.getElementById("view-signals").hidden = name !== "signals";
  document.querySelectorAll(".tab").forEach(el =>
    el.classList.toggle("active", el.dataset.view === name));
  if (name === "signals") {
    if (!document.getElementById("tickerOptions").children.length) loadTickerOptions();
    loadSignalsPage();
  }
}

async function loadTickerOptions() {
  try {
    const list = await api("/api/signals/tickers");
    document.getElementById("tickerOptions").innerHTML =
      list.map(t => '<option value="' + esc(t) + '"></option>').join("");
  } catch (err) { /* options are optional */ }
}

function sigPage(delta) {
  const target = sigState.page + delta;
  if (target < 1 || target > sigState.totalPages) return;
  sigState.page = target;
  loadSignalsPage();
}

function applyTickerFilter() {
  const val = document.getElementById("sigTicker").value.trim().toUpperCase();
  sigState.ticker = val;
  sigState.page = 1;
  loadSignalsPage();
}

function clearTickerFilter() {
  document.getElementById("sigTicker").value = "";
  sigState.ticker = "";
  sigState.page = 1;
  loadSignalsPage();
}

async function resendSignal(id) {
  try {
    await api("/api/signals/" + id + "/resend", { method: "POST" });
    toast("Signal resent to Telegram with a duplicate remark");
  } catch (err) { showError("Resend failed: " + err.message); }
}

async function resendActive(id) {
  try {
    await api("/api/instruments/" + id + "/resend-active", { method: "POST" });
    toast("Active signal resent to Telegram with a duplicate remark");
  } catch (err) { showError("Resend active failed: " + err.message); }
}

function signalTypeBadge(t) {
  if (t === "PositionOpened") return badge("OPEN", "green");
  if (t === "PositionClosed") return badge("CLOSE", "blue");
  return badge(t || "—", "gray");
}

function humanizeEnum(s) {
  return s ? String(s).replace(/([A-Z])/g, " $1").trim() : "";
}

async function loadSignalsPage() {
  const box = document.getElementById("sigRows");
  if (currentView !== "signals") return;
  if (!sigState.hasRows) box.innerHTML = '<tr><td colspan="11" class="empty">Loading…</td></tr>';
  let params = "page=" + sigState.page + "&pageSize=" + sigState.pageSize;
  if (sigState.ticker) params += "&ticker=" + encodeURIComponent(sigState.ticker);
  try {
    const res = await api("/api/signals?" + params);
    sigState.total = res.total || 0;
    sigState.totalPages = Math.max(1, Math.ceil(sigState.total / sigState.pageSize));
    if (sigState.page > sigState.totalPages) {
      sigState.page = sigState.totalPages;
      sigState.hasRows = false;
      box.innerHTML = '<tr><td colspan="11" class="empty">Loading…</td></tr>';
      loadSignalsPage();
      return;
    }
    renderSignalRows(res.items || []);
  } catch (err) {
    box.innerHTML = '<tr><td colspan="10" class="empty">Failed: ' + esc(err.message) + "</td></tr>";
  }
}

function renderSignalRows(items) {
  const se = document.scrollingElement || document.documentElement;
  const prevScroll = se.scrollTop;
  const box = document.getElementById("sigRows");
  sigState.hasRows = items.length > 0;
  if (!items.length) {
    box.innerHTML = '<tr><td colspan="11" class="empty">No signals' +
      (sigState.ticker ? " for " + esc(sigState.ticker) : "") + ".</td></tr>";
  } else {
    box.innerHTML = items.map(s => '<tr>' +
      '<td class="mono">' + fmtTime(s.timestamp) + '</td>' +
      '<td><b>' + esc(s.ticker || "") + '</b></td>' +
      '<td>' + signalTypeBadge(s.type) + '</td>' +
      '<td>' + (s.direction === "Long" ? badge("LONG", "green") : s.direction === "Short" ? badge("SHORT", "red") : "—") + '</td>' +
      '<td class="mono num">' + fmtNum(s.price, 4) + '</td>' +
      '<td class="mono num">' + fmtNum(s.stopLoss, 4) + '</td>' +
      '<td class="mono num">' + fmtNum(s.takeProfit, 4) + '</td>' +
      '<td class="mono num">' + fmtNum(s.exitPrice, 4) + '</td>' +
      '<td>' + (s.exitReason ? esc(humanizeEnum(s.exitReason)) : "—") + '</td>' +
      '<td class="mono num">' + fmtPct(s.pnlPercent) + '</td>' +
      '<td><button class="btn" title="Repost this signal to Telegram as a duplicate" onclick="resendSignal(\'' + s.id + '\')">Resend signal to Telegram</button></td>' +
    '</tr>').join("");
  }
  document.getElementById("sigTotal").textContent = sigState.total ? sigState.total + " entries" : "";
  document.getElementById("sigPageInfo").textContent = "Page " + sigState.page + " / " + sigState.totalPages;
  document.getElementById("sigPrev").disabled = sigState.page <= 1;
  document.getElementById("sigNext").disabled = sigState.page >= sigState.totalPages;
  se.scrollTop = prevScroll;
}

document.getElementById("sigTicker").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); applyTickerFilter(); }
});

document.getElementById("addForm").onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  const payload = Object.fromEntries(new FormData(f).entries());
  payload.ticker = payload.ticker.trim().toUpperCase();
  try {
    await api("/api/instruments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
    toast("Created " + payload.ticker);
    f.reset(); await refresh();
  } catch (err) { showError("Create failed: " + err.message); }
};

async function boot() {
  await refresh();
  setInterval(refresh, 5000);
}
boot();
</script>
</body>
</html>
