<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrument details</title>
<link rel="stylesheet" href="/admin/app.css">
</head>
<body class="page-details">
<header>
  <h1 id="title">Instrument details</h1>
  <button class="btn" id="btnReset" title="Reset zoom and price scale">Reset view</button>
  <div id="legend"></div>
</header>
<main>
  <div class="tabs">
    <button class="btn tab active" id="tabPrice" title="Price chart with candles and trades">Price</button>
    <button class="btn tab" id="tabEquity" title="Total equity of this instrument over time">Equity</button>
  </div>
  <div class="chartwrap">
    <canvas id="cv"></canvas>
    <div class="tooltip" id="tip"></div>
  </div>
  <section class="details">
    <div class="pnlbar">
      <div class="pnlcard total" id="pnlCardTotal">
        <span class="lbl">Total PnL</span>
        <div class="valrow">
          <span class="val" id="pnlTotal">—</span>
          <span class="val pct" id="pnlTotalPct">—</span>
        </div>
      </div>
      <div class="pnlcard" id="pnlCardUnrl">
        <span class="lbl">Unrealized PnL</span>
        <div class="valrow">
          <span class="val" id="pnlUnrl">—</span>
          <span class="val pct" id="pnlUnrlPct">—</span>
        </div>
      </div>
      <div class="pnlcard" id="pendingCard">
        <span class="lbl">Pending signal</span>
        <span class="val" id="pendingSignal">—</span>
      </div>
    </div>
    <div class="card">
      <div class="sighead">
        <h2>Recent signals</h2>
        <span class="empty" id="sigUpdated"></span>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>Time</th><th>Type</th><th>Dir</th><th>Price</th><th>SL</th><th>TP</th><th>Exit</th><th>Exit reason</th><th>PnL</th></tr>
          </thead>
          <tbody id="sigRows">
            <tr><td colspan="9" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="/admin/pts.js"></script>
    <script src="/admin/chart.js"></script>
    <script src="/admin/details.js"></script>
</body>
</html>
