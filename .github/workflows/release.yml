name: Build and Release Fixes

on:
  push:
    tags:
      - 'v*' # Пайплайн запускается при пуше тега (например, v1.0.1)
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Установка нужной версии SDK

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run .NET Tests
        # Прогоняем тесты (AtrTests, RocSignalTests и т.д.) перед сборкой
        run: dotnet test moex-roc-basket-long-short/PortfolioTradingSystem/PortfolioTradingSystem.slnx --configuration Release

      - name: Build and Publish .NET App
        # Собираем готовые бинарники в папку publish_output
        run: dotnet publish moex-roc-basket-long-short/PortfolioTradingSystem/PortfolioTradingSystem.slnx -c Release -o ./publish_output

      - name: Package the fix
        run: |
          # Создаем временную папку для подготовки архива
          mkdir release_package
          
          # Копируем собранный .NET бэкенд
          cp -r ./publish_output/* release_package/
          
          # Копируем Python скрипты и файл с зависимостями
          cp moex-roc-basket-long-short/moex_data_downloader.py release_package/
          cp moex-roc-basket-long-short/PortfolioTradingSystem/implementation_requirements.txt release_package/
          
          # Упаковываем всё в zip-архив
          cd release_package
          zip -r ../app-fix-release.zip .

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app-fix-release.zip
          generate_release_notes: true